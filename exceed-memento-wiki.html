# EXCEED/MEMENTO

## Main Season List
- Genesis Season — Ascendance of the Gods and Goddesses
- First of Six Season — The First War and the Shattering of Time
- Twilight Catastrophe Season — The Tragedy of Light & Dark
- Hack Rebel Season — Empire of Lightning Tyrants
- Silent Rebel Season — The Crimson Requiem
- Magicalia Season — Welcome to Magicalia!
- Rebel Season — The Open War
- Eclipse of Worlds Season — The War of Twin Realities
- Shattered Legacy Season — The Wish of the Fifth
- Divine Restoration Season — The Grand Purification
- Echoes of the Future Season — Our Timeline! Don't Break!
- Cosmic Error Season — Un-Magical Worlds and the Broken Seal of the Absolute
- Apocalypse of Divinity Season — The Final War Against the Absolute God
- Return Season — Unwelcoming Welcome Back
- End of Old Journey Season — The Peaceful New Generation

## Naming Notes
- Primary, Secondary, and Tertiary are only noble-hierarchy terms in the magic world. These terms are not used for the Gods and Goddesses.
- The Gods and Goddesses use deeper, symbolic terms: Flame (not Fire) and Sky (not Weather). For example, the known title is "Flame of Love," not "Fire of Love." Nations, races, and nobles, on the other hand, use the more functional terms Fire and Weather.
- Land, not Earth. In the original Indonesian, the Earth element is called Tanah ("land" or "soil"): the Land Nation, the Land race, the Goddess of Life of Earth. This wiki renders the nation as "Land Nation" and keeps "Earth" as the name of the element itself.
- Scripture only appears in Season 15. Before that, there was no written statement from the Gods and Goddesses to their creations. The Oath of Kings and Queens is far older than scripture.
- "Human" means a real-world human. The first two mothers of the magic world are called the First Angel and the First Demon.

---

## Season 1 — Genesis Season
*Ascendance of the Gods and Goddesses*

In the beginning, there was a group of humans with extraordinary intelligence. But their abilities made them victims of jealousy and mistreatment from the people around them.

The First Figure, the neutral Supreme God, moved them to an empty dimension of black and white, saying:

> "Kore ga omae-tachi no sadame da." (This is your fate.)

There, they received the status of Gods and Goddesses and began creating a new universe.

Among them were two humans who loved each other. In the end, the two merged into a single entity: the God of Everything (GoE).

GoE wanted a world that was perfect, peaceful, and free of suffering. In its view, a world resembling the human world, with its excessive emotions and desires, was an imperfect one. So it wanted to destroy the existing world and create a new one according to its own will.

But GoE's wish to create peace grew into a desire to rule over everything. It no longer wanted only peace, but also absolute power over the world it had created.

In the end, GoE began to lose control and show instability. The conflict carried into the next season, when the Gods and Goddesses tried to stop it.

The full origin of the pair that became GoE is told further in EXCEED/MEMENTO: Key.

## Season 2 — First of Six Season
*The First War and the Shattering of Time*

In the age of kingdoms, the rulers of various lands faced a great war involving the God of Time (GoT). GoT was under GoE's control, so its power was used to disrupt the flow of time and trigger conflict.

This war became one of the most important events in the history of the magic world. The rulers tried to stop the chaos, but the power of time they faced was far beyond their abilities.

As a result of the conflict, GoT shattered into six parts. Each part had a different time power and personality, and was then scattered across various timelines.

The six fragments are:
- Light — Next: moves time toward the next state.
- Darkness — Previous: moves time toward the previous state.
- Fire — Play/Reverse: reverses the flow of time at normal speed.
- Water — Pause: stops the flow of time.
- Earth — Fast Forward: speeds up the flow of time.
- Wind — Rewind: rewinds time quickly.

The fragments are hard to find, even though their presence can be seen from afar. Their scattering made time travel and time control far more complicated.

The war also caused suspicion that there might be traitors among the rulers. The conflict that followed became known as part of the history of the First World War.

### Final outcomes of Season 2
- The God of Time shattered into six fragments with different time powers and personalities.
- All six fragments were scattered across various timelines.
- The Nation of Light moved to the Aether dimension.
- The Nation of Darkness moved to the Nether dimension.
- The relocation of both nations made their existence even harder for other worlds to reach.
- The rulers of this era became an important part of the history of the Reincarnation system. Their souls would later be known as the fifth soul, which returns to play a role in Season 9.
- The position of God of Time was left empty. For the time being, the God of Time from Season 15 came to this era to take their place (see the Time Relations and Timelines section).

## Season 3 — Twilight Catastrophe Season
*The Tragedy of Light & Dark*

The Nation of Light finally returned from Aether, and the Nation of Darkness returned from Nether. But the history of both nations had been forgotten by most of the world's population.

The Fire Nation and the Land Nation enslaved the people of Darkness, while the Water Nation and the Wind Nation enslaved the people of Light.

The rulers of Light and Darkness then held a secret meeting. They devised a plan to end the oppression using a Light bomb and a Dark bomb.

The two deliberately triggered a war and detonated the bombs. But the act only produced a greater tragedy. The pure elements of Light and Darkness were contaminated, giving rise to the phenomena of Null and Anti-Null.

In the midst of the chaos, the Primary nobles used the Reincarnation spell for different purposes. Some wanted revenge, some wanted to change the world order, and others wanted to repair the damage that had been done.

The Reincarnation system then grew into an important part of the conflict that ran through the following seasons.

## Season 4 — Hack Rebel Season
*Empire of Lightning Tyrants*

The Lightning Nation ruled the world through advanced technology and an extremely strong system of government.

Corporator 1 tried to destroy that power by hacking the technology used by the Lightning government. The hack nearly destroyed the nation, but Corporator 1 fell before managing to topple the Lightning King.

Although the attempt failed to reach its final goal, Corporator 1's actions became the start of a chain of rebellions that continued onward.

## Season 5 — Silent Rebel Season
*The Crimson Requiem*

After the death of Corporator 1, the struggle was carried on by Corporator 2.

Using the results of the earlier hack, Corporator 2 launched attacks and assassinations against the officials and rulers involved in the Lightning system of government.

But the resistance ended when Corporator 2 was killed by guards, surviving members of the military, and the King's children who had managed to survive.

The struggle then passed to Corporator 3, who had to continue the mission under the burden of their two predecessors' failures.

## Season 6 — Magicalia Season
*Welcome to Magicalia!*

Corporator 3 from the King's side entered another world and enrolled in the Magicalia magic academy.

They pretended to lack ability in most of the magic pillars, as if they only mastered Knowledge. In reality, their mastery of Knowledge was far more perfect than that of the Queen's side.

This season has a lighter atmosphere, full of comedy and school life. The knights from their nations also attended school there and ended up becoming student council presidents.

Although it looks like an ordinary school-life story, the experience at Magicalia became an important part of the characters' development and relationships.

## Season 7 — Rebel Season
*The Open War*

Corporator 3 began searching for the old bodies tied to the Reincarnator timeline.

They learned that Corporator 1 and Corporator 2 had died. So they had to continue the struggle in their own way, while still carrying the influence of their predecessors' actions.

The conflict with the Lightning Nation kept growing until it turned into open war.

In this season, the six fragments of the God of Time were also brought together. After each had lived separately in different timelines, they were now whole entities with opinions of their own, so the reunion did not go smoothly.

## Season 8 — Eclipse of Worlds Season
*The War of Twin Realities*

The war between the original world and the Mirror World became the center of the conflict.

Corporator 3 from the future opened a portal connecting the Mirror World to the original world. This caused the two worlds to collide and triggered chaos whose cause was unknown to most parties.

In this conflict, the knights sacrificed themselves to protect Corporator 3. The event took place on the same date as the deaths of their wives, even with the same smile they wore as they faced their respective fates.

### Reunification of the God of Time
In the midst of the events of Season 8, the six fragments of the God of Time, shattered since Season 2 and brought together without harmony in Season 7, finally reunited as the God of Time.

At first, GoT's appearance after reunification was still the same as before: heavy armor and an extremely thick cloak, giving the impression of a king. Its face remained hidden behind the armor.

After all six fragments merged, GoT said:

> "Metamorphosis..."

Afterward, its appearance changed drastically.

Its heavy armor became sleek, light knight's armor. Its thick cloak was replaced by thin cloth resembling a wanderer's scarf or shawl, wrapped softly around its neck. The lower part of the cloth looked tattered, in a dim, slightly translucent purple.

No hood covered its head. GoT's purple aura remained after the transformation, while its face was still covered by armor.

This metamorphosis was a major change to GoT's appearance after its six fragments became a single entity again.

## Season 9 — Shattered Legacy Season
*The Wish of the Fifth*

Corporator 3 woke from crystallization and discovered that their wives and companions from the Queen's side had also been crystallized.

The cause turned out to be linked to Corporator 3's children, who were being controlled by an evil Reincarnator claiming to act in GoE's name.

In this season, the identity of the fifth soul began to be revealed. The fifth soul is not the First Kings who unified the noble territories into nations. They are the rulers from Season 2, who were once the original creators of Reincarnation magic.

Those rulers had lost their active role after the Reincarnation system changed. But their power was never truly gone.

When Corporator 3's emotions reached an extreme point, the souls from Season 2 could take over their bodies without Corporator 3, the Reincarnator, Corporator 1, or Corporator 2 realizing it.

The fifth soul warned Corporator 3 about the threat from their children and directed them toward legendary armor and weapons in another world.

## Season 10 — Divine Restoration Season
*The Grand Purification*

The characters tried to restore the world from the effects of Null and Anti-Null.

They traveled across various timelines to find the original bodies of souls that had moved on. Using time magic, they tried to return those souls and revive those who could still be saved.

Souls considered impure did not simply vanish. They remained part of the struggle to repair the world.

At first, the Gods and Goddesses, including the God of Time and the two Goddesses of Life, opposed the effort. But they eventually agreed to help, with several conditions.

## Season 11 — Echoes of the Future Season
*Our Timeline! Don't Break!*

Corporator 3 from the future returned to the past to prevent the worst timeline from happening.

They were willing to use any means, including tactics that could damage other people's psychological condition, to prevent a future they considered unacceptable.

They also consciously and deliberately opened the portal connecting the Mirror World to the original world. They knew this action risked triggering a conflict like the one in Season 8. The portal was not an incident caused by carelessness, miscalculation, or ignorance of the consequences.

Their goal was to keep people on alert. They understood that GoE could become a threat again at any time, sooner or later. The peace of the moment was no guarantee that the danger had truly ended.

To Corporator 3 from the future, the GoE threat must not be ignored just because the time of its awakening was unknown. They chose to keep the world vigilant, even if that decision meant bringing about a conflict that could have been avoided in the short term.

Therefore, their actions were a deliberate strategic decision, not a mistake they realized only after disaster struck. They knew the risks and made the decision anyway, because they considered readiness for the GoE threat more important than preserving a peace that could make everyone complacent.

This decision did not go unchallenged. The God of Time, after the Metamorphosis, confronted Corporator 3 from the future over these actions.

## Season 12 — Cosmic Error Season
*Un-Magical Worlds and the Broken Seal of the Absolute*

Monsters created by the God of Space attacked a universe that has no magic.

Corporator 3 and their allies entered that world to face the threat that had appeared. But the chain of events that followed ended up breaking GoE's seal.

The threat that had previously been confined regained the chance to affect the world.

This season was deliberately made a "showcase": displaying various possible forms of the world, and opening room for many characters to develop. Its weight was never meant to equal the other seasons, because the number of characters in this story is very large.

## Season 13 — Apocalypse of Divinity Season
*The Final War Against the Absolute God*

GoE rose again. The entire world and the Gods and Goddesses united to face a threat that could destroy the whole order of the universe.

The battle became a great war deciding the fate of many worlds and timelines.

After the conflict reached its end, the First Figure asked the Gods and Goddesses whether they wanted to remain Gods and Goddesses or return to being humans.

> "Do you want to stay Gods? Or become humans in the real world?"

It asked them to think about the choice while returning to the real world.

GoE was defeated and sealed, but not truly killed. The threat it posed had not entirely ended.

This choice was deliberately not dramatized. The Gods and Goddesses were instead confused: "Why did he turn out like this? Why is he giving us a choice?" That confusion was made parallel to the audience's reaction, so the scene was left feeling odd, not emotional. The First Figure's cold tone here echoes their line in Season 1.

## Season 14 — Return Season
*Unwelcoming Welcome Back*

The Gods and Goddesses returned to the real world after the great war. Although they had experienced trillions of years in the magic world, only about two months passed in the real world.

But their return was not welcomed as they had hoped.

Some greedy humans opened a portal to the magic world and tried to colonize it. They regarded the magic world as a place that could be exploited for their own interests.

This act enraged the Gods and Goddesses. They closed the portal to stop humans from colonizing again.

Before leaving the real world, the two Goddesses of Life gave chrysanthemums as a farewell and an expression of anger.
- The Goddess of Life of Earth brought white chrysanthemums, symbolizing a peaceful death.
- The Goddess of Life of Water brought black chrysanthemums, symbolizing a death full of suffering.

The two stood with their shoulders touching. The Goddess of Life of Earth leaned her shoulder to the right, while the Goddess of Life of Water leaned hers to the left. Each held a bouquet in one hand and raised a middle finger with the other.

Their auras were so powerful that the humans around them suffered terrible physical reactions.

The pose was a final tribute that was at the same time an insult to the humans who had tried to colonize the magic world.

Humans then misread the act as betrayal. Greedy researchers began studying the flowers and trying to reopen the portal.

But their research ended in failure and death. The flowers hastened the death already destined for those who touched or studied them. Machines that came into contact with them rusted or stopped working.

The two Goddesses of Life cannot die. In fact, the portal leading to the magic world can reach the afterlife. Humans who died because of the flowers were moved to the afterlife of the magic world, while the greedy humans who tried to colonize that world were sent directly to its hell.

### Transfer of World Ownership and the Fate of the First Figure
The portal-opening event also caused a transfer of world ownership. The real world, previously the base world owned by the First Figure, became the property of the Gods and Goddesses. Because other worlds depend on the order of the base world, the transfer of ownership also affected the other worlds.

The First Figure vanished at the exact moment ownership of the world passed from them to the Gods and Goddesses, in Season 14.

**The First Figure's last request.** Before vanishing, the First Figure asked that the good people of the original world (the default world), both the living and those already in the afterlife, be moved to the afterlife of the magic world. The Gods and Goddesses refused. The First Figure then said to let those people live in peace in their own world. This time the Gods and Goddesses agreed.

The Gods and Goddesses are not cruel beings. Emotions make them subjective, but they strive to be supremely just.

## Season 15 — End of Old Journey Season
*The Peaceful New Generation*

After the great conflict ended, the Gods and Goddesses lived more peaceful lives.

They used GoE's power to create perfect souls. The two Goddesses of Life also separated the dragons' souls from the knights' bodies so they could meet again in the afterlife.

The Reincarnators became Kings. Corporator 1, Corporator 2, and Corporator 3 from the King's side were adopted by the Reincarnators and became teachers at the academy where they once studied.

Meanwhile, Corporator 1, Corporator 2, and Corporator 3 from the Queen's side were also adopted. They lived happier family lives while waiting for their husbands.

Both groups kept the personalities they showed when they were still students. That attitude became their way of hiding past trauma so the next generation would not have to bear the same burden.

The Gods and Goddesses gave scripture to the Kings. The Kings, who swore as bearers of the trust and messages of the Gods and Goddesses, passed its contents on to the people. This scripture only exists in Season 15, after all the great conflicts had passed. It contains explanations of the origin of humans, the creation of the world, and the relationship between humans and the Gods and Goddesses.

## The New Human World and the 18 Leaders
This section takes place after the very last film (Unresolved Divine Absolute).

### One Planet, Two Faces
The human world's new world is literally the same EXCEED/MEMENTO world. The difference is that the six nations are on the front face of the planet, while the human world is on its back.

Astronomers and geographers in the human world are puzzled because the planet feels like it has grown larger. The planet really did grow larger.

### Humans Carried Into the Magic World
Many humans were teleported along and revived in the magic world. Their magic adapts to each person's imagination.

One of them is a miko who was brought along with her shrine. When Reina (Goddess of Star) wanted to visit her in human form, it went like this:

> Miko: "A-Amaterasu-sama?!"
> Reina: "..."
> Miko: "Ah! Do you need something?!"
> *Reina vanishes, returning to the realm of the Gods and Goddesses.*
> Miko: "H-Huh?! Where did she go?!"

The miko thought Reina was Amaterasu, the Sun Goddess. The guess was not entirely wrong: Reina is the Goddess of Star, and the sun is a star.

This miko has a fox mask. She wore it while trying to make a summer festival at night with her magic. Because magic adapts to imagination, the result was unexpected:

> Miko: "Uhh... It's so loud. My butt hurts... Wait..."

She felt the top of her hair, found "ears," then felt the back of her body. Her tail was caught under her long skirt.

> Miko: "A tail?!"

She checked how many tails she had.

> Miko: "There are 9?! Huh?! EHHHHHHHHHHHHHHH?!! Ahh..."
> The Gods and Goddesses (visiting): "Huh?! KITSUNE?!"
> Miko: "HUH?!"
> Everyone: "EHHHHHHHHHHHHHHHH?!!"

In the end, the miko became a nine-tailed kitsune with four ears (human ears and fox ears).

### The 18 Leaders
A new inscription appeared, reading: "Create a Nation with 18 leaders representing each basic Element."

The miko became one of those leaders, representing the Goddess of Star.

## Films and Spin-offs

### 1. Alternative Timeline Chronicles
A collection of stories focusing on alternative timelines. Each story can have different conflicts and developments, so none is tied to a fixed chronological position.

### 2. EXCEED/MEMENTO: Second Bloods
Set after Season 3 and before Season 4.

The story focuses on the political shift from the dominance of the Primary nobles toward the Secondary nobles. The Tertiary nobles fled, and the conflict then grew into a world war. In the end, Lightning won the war and ruled the world.

### 3. EXCEED/MEMENTO: Aftermath (Far Before the End)
Set after Season 8 and before Season 9.

The Corporator 3s from the Queen's side regained their powers and became extremely formidable mages and fighters.

When their husbands from the King's side were crystallized, the Corporator 3s from the Queen's side were appointed to rule their respective kingdoms. They were also pregnant.

After giving birth, they ran the kingdoms while raising their children, who would later become part of the disaster of Season 9.

### 4. EXCEED/MEMENTO: Key
Set before Season 1.

This film tells of genius humans who became victims of bullying and the jealousy of the people around them. They were then moved to an empty black-and-white dimension, where they gained the status of Gods and Goddesses.

The film also reveals the origin of the human pair who ended up merging into the God of Everything (Fujisaki Yōna and Kisaragi Inori).

Besides the story of that pair, Key introduces the pasts of several humans who would later become Gods and Goddesses. Before gaining divine status, they had lives, relationships, and traumatic experiences that helped shape their personalities after becoming Gods and Goddesses.

Of the twenty Gods and Goddesses, only four were ever involved in a killing while human: Mizuki, Mitsuki, Fuyuki, and Reina. The four form two pairs, and in both pairs one would not let the other bear everything alone.

#### Mizuki and Mitsuki — The Secret Behind the Accident
Mizuki and Mitsuki grew up with a father who was a heavy drinker and often violent toward them.

For years, they had to endure this mistreatment. In the end, they both reached a point where they could no longer bear it.

In the event that changed their lives, Mizuki and Mitsuki killed their father with a flower pot they had lovingly tended. They then made it look like an accident, as if the pot had fallen from the balcony and caused their father's death.

The death was believed to be an accident. The people around them did not know what really happened. Some neighbors even thought the death was deserved because they knew how the father had treated his two children.

After that, Mizuki and Mitsuki ended up in an orphanage. They were then taken in by the Tachibana family, a family that was very kind to them.

The new family's kindness only stirred an inner struggle. People who had lived in violence finally received love and protection they had never felt before. But they also kept a secret about their father's death.

In the midst of this new life, the two questioned whether they truly deserved the kindness given to them.

> "Do we deserve a family this kind..."

The Tachibana family accepted and loved them without knowing the truth behind their father's death. For Mizuki and Mitsuki, that kindness became something precious and at the same time hard to accept, because they could not forget what had happened.

**A light moment after the adoption.** The names Mizuki and Mitsuki are almost identical. In Japanese pronunciation, the sounds "z" and "ts" are easily confused, just like "Mezamero," which is often misheard as "Metsamero," though that usually happens through errors when translating Japanese into romaji. People often called them by the wrong name:

> Person: "Tachibana-san!"
> Both: "Yes!"
> Person: "Ah! Gomen ne! Mitsuki-san!"
> Both: "Yes!"
> Person: "..."
> Both: "Huh?"
> Person: "MI- TSU-KI! SANNNNNNNNN!~"
> Mitsuki: "AHH! YES!"

Their story is not only about the secret of a death, but also about guilt, trauma, and the difficulty of accepting affection after a life full of violence.

#### Fuyuki and Reina — Loss, Revenge, and Regret
Fuyuki and Reina were childhood friends who grew up to become delinquent teenagers. The two were close and spent their youth together with their group.

But their lives changed when Fuyuki's best friend was killed.

The loss left Fuyuki consumed by anger and a desire for revenge. Reina, who did not want to leave Fuyuki to face everything alone, helped him kill the culprit. They then hid the body so their actions would not be discovered.

That decision became a turning point for both. Although they felt they had avenged Fuyuki's friend's death, the act did not erase the loss they had suffered. Instead, they had to face the trauma and burden of their own deeds.

When they entered college, Fuyuki and Reina began to repent. They tried to leave their old lives behind and move on in a different way.

But the change did not automatically erase the impact of the past.

Fuyuki became very cold after his best friend's death. Reina was angry at herself for being unable to take the place of the person who had died. She had accompanied Fuyuki since childhood, helped him when they took revenge, and stayed by his side after it was all over. Yet she realized that their closeness did not let her erase Fuyuki's grief.

Reina felt as if she had always failed to be the person Fuyuki needed, even though she had tried to stay close to him.

In the end, their relationship held a question more complicated than mere friendship. Reina had to face her own feelings, while Fuyuki still carried the loss and trauma that shaped him.

The story of Fuyuki and Reina is an important part of their journey before gaining status as Gods and Goddesses. This past also became the foundation for the emotional conflict that resurfaced after they became divine entities.

### 5. EXCEED/MEMENTO: Unresolved Divine Absolute
Continues the story after Season 15.

As a Goddess, Reina cannot die the same way a human can. She can only lose her existence.

All this time, Reina had been used to being the figure who seemed to shine the brightest. But behind that, she had begun to feel weary and exhausted. She kept pretending to be the brightest figure, even as she herself was losing more and more energy.

As she was about to vanish, Reina looked back over her entire past, especially her most beautiful memories with Fuyuki.

For the first time in a long while, she questioned whether she still wanted to live.

In the end, she begged to be able to live again.

But she did not beg anyone else.

She begged herself.

Then, Reina saw a word.

Reina struggled through the process of change. Her body nearly vanished, but she kept trying to hold on.

The change marked the rebirth of the Goddess of Star as a new star.

The process took place only a few seconds before Reina would have been completely annihilated. Suddenly, strange energy enveloped her.

That energy turned out to come from her worshippers.

They begged for the Goddess of Star to stay alive. Their prayers became part of the energy that helped her hold on.

Reina, long known as one of the strongest beings in the Lucid Dream, finally made it through the process.

Frost hugged her immediately.

## Power System: Three Pillars
The magic system of EXCEED/MEMENTO is built on three main pillars:
- Physical (P): the body, physical endurance, and bodily abilities.
- Mental (M): mental state and the strength of the soul.
- Knowledge (K): knowledge, understanding, and the ability to process information.

The base magic value is determined by the lowest pillar.

`PMK = min(P, M, K)`

The remaining pillar values are then used to calculate derived abilities.
- PM: bodily resilience, based on the smaller of Physical and Mental.
- PK: conscious movement and reflexes, based on the smaller of Physical and Knowledge.
- MK: experience, based on the smaller of Mental and Knowledge.

The formulas for the derived abilities are:
- PM = min(P, M)
- PK = min(P, K)
- MK = min(M, K)

Each one unit of Magic equals 60 MP.

### System Inspiration
This system was made because it makes no sense for a character in a magic world to become extremely strong through physical training alone while their personality, mind, and knowledge stay weak.

The pillar with the lowest value becomes a bottleneck for the other pillars when calculating the four formulas.

Because of this, Travelers are required to train all their pillars in various ways. They cannot rely on a single type of training to develop all their abilities.

### Calculation Example
Bellus Lux has the following values:
- Physical = 90
- Mental = 80
- Knowledge = 20

Then:

PMK = min(90, 80, 20) = 20

After PMK is calculated, the remaining Physical is 70 and the remaining Mental is 60.

PM = min(70, 60) = 60

The remaining unused Physical is 10. The stat breakdown is therefore:
- PMK = 20
- PM = 60
- Physical = 10

The total stats can be written as:

`Total Stats = 20 PMK + 60 PM + 10 P`

Bellus Lux is a Monopillar (+Physical) because Physical is the most dominant pillar.

### Pillar Types
- Monopillar: one pillar is the most dominant.
- Dipillar: two pillars have balanced values.
- Tripillar: all three pillars have balanced values.

The pillar type determines the class classification a person can have. For Tripillars specifically, a person automatically becomes an Omnist. Omnist is not a class that users of other classes can freely choose, but a special class obtained when a person reaches the Tripillar classification.

### Magic Classes

| Class | Role |
| :--- | :--- |
| Fractor | Fighter |
| Sagarist | Assassin |
| Telarist | Marksman/Ranger |
| Arcanist | Mage |
| Praetor | Tank |
| Arbitor | Support |
| Omnist | Special class for Tripillars |

Monopillar and Dipillar users use the class that matches their combat role. Tripillar users, meanwhile, are automatically classified as Omnist, without having to choose that class separately.

Because Omnist is a special Tripillar classification and does not directly indicate a combat specialization, a favorite role or specialty can be added after the class name in the format Omnist-[specialty class].

For example:
- Omnist-Fractor: a Tripillar user who specializes as a Fighter.
- Omnist-Sagarist: a Tripillar user who specializes as an Assassin.
- Omnist-Telarist: a Tripillar user who specializes as a Marksman/Ranger.
- Omnist-Arcanist: a Tripillar user who specializes as a Mage.
- Omnist-Praetor: a Tripillar user who specializes as a Tank.
- Omnist-Arbitor: a Tripillar user who specializes as Support.

Thus, Omnist remains the main classification marking a Tripillar, while the class added after the hyphen indicates their combat specialization.

### Magic Strata

| Stratum | Value |
| :--- | :--- |
| I | ≤600 |
| II | 601–1,200 |
| III | 1,201–3,600 |
| IV | 3,601–14,400 |
| V | 14,401–72,000 |
| VI | ≥72,001 |

The stratum is determined by maximum mana capacity, taking into account the calculation of Magic Points and Magic.

The higher the Physical, Mental, and Knowledge values, the greater the mana capacity and regeneration ability.

### Magic and Imagination
For humans carried into the magic world, magic adapts to the user's imagination (see the Miko in the New Human World section). Scripture also states that the magic system was created not with magic, but with the will of the Gods and Goddesses.

### Crystallization
When a person's mana runs out, their body can undergo crystallization.

In this condition, Physical is considered no longer functioning. The body's mana regeneration stops and the crystal can only absorb mana from the environment, which is often very slow.

If the soul chooses to go to the afterlife, the body left behind keeps absorbing mana and eventually becomes a mana crystal.

The crystal can look beautiful, but its existence holds tragedy. The crystal form stays young and is only eroded slowly.

Some choose death because they cannot bear the loneliness that lasts for years. They must endure in a crystal body without being able to do much, waiting for mana from nature to refill their capacity.

If a person is successfully revived, all three of their pillars can increase drastically.

## Noble Hierarchy and Nations
Each nation has three levels of nobility based on its main element.
- **Primary:** handles government, law, administration, and the nation's economy.
- **Secondary:** responsible for defense, the military, and security.
- **Tertiary:** handles medicine and health, research, education, and public service and support.

There is a unique political system called Open Crown politics. People are free to choose their own path in life, and social mobility remains possible. Nobles can change roles or levels based on ability, achievement, assignment, marriage, and certain circumstances.

The First Kings were the original rulers who unified the noble territories into nations. Before that unification, the territorial leaders already had cooperative relationships.

The Open Crown system leaves room for growth and change, but high openness and trust can also be exploited for betrayal and political assassination.

### The Three Wanderers
A story about three wanderers was once famous. This tale is like a bedtime story known throughout the world: one leads, one protects, and one heals while also developing weapons for the others. This division of roles parallels the three levels of nobility. In other words, since ancient times this world has been "force-fed" a warm version of the tale, a kind of propaganda planted from childhood.

The reality is far darker. The three wanderers really existed, and they came from three different races. They died tragically when they were manipulated by an ancient being with the ability to manipulate body and mind. They tried to survive, but their own bodies betrayed them. So they chose to die:
- The first impaled themselves on a poisoned sword.
- The second impaled themselves on the sharp edge of a shield.
- The third let themselves be poisoned by a potion they had made themselves.

**Time of the event:** the hunting age, when humans were no longer nomadic. The event took place after Season 1 and after the races had formed, long before the age of kingdoms in Season 2.

**Evidence:** the story is recorded in a cave through very beautiful paintings, along with the complete story text carved into stone.

## Nation Profiles
- **Light:** famous for delicious food and drink, and advanced technology. Some of its people can run as fast as light or think as fast as light, but get hungry easily. Also known for a wide variety of plants, including excellent herbal plants. Some can even cure cancer and grow only in the Nation of Light.
- **Darkness:** the nation of writers, film, libraries, and observatories. The night sky there looks strikingly clear even when cloudy or during the rainy season. The safest nation.

### Heart of the Sea
The Heart of the Sea is a human-made object placed in the sea. People who are not of the Water race can breathe when near it.

How it is made: salt is compressed under extreme pressure, like making a diamond. The salt is then polished with a special spoon. The salt is crystallized again with seawater, then polished again. If it succeeds, the salt glows blue.

## Origin of the Races
In the beginning, there were two main races: Angels and Demons.

The First Angel and the First Demon were two women. Each gave birth without a man, to many children.

Some Demons adopted new elements and beliefs, then developed into the Fire and Wind races. Demons who kept their original beliefs remained the Darkness race.

Some Angels adopted new elements and beliefs, then developed into the Water and Land races. Angels who kept their original beliefs remained the Light race.

### How the Races Formed
The formation of the races took place long before Season 2, in the age when the First Angel and the First Demon descended. This split was not the result of conflict, but of differences in each group's beliefs, which began from curiosity:
- **Fire:** in primeval times, when a fire blazed, people were excited and learned from it. From there the Fire race formed.
- **Land:** a group of people went into a cave that sheltered them from extremely strong winds.
- **Wind:** in an arid and hot environment, they felt excited when touched by the wind and wanted to feel it again.
- **Water:** they found water. The sensation of drinking it was refreshing, and then the sound of flowing water was very soothing.

The Wind Nation and the Land Nation later swapped territories because their original territories did not suit the research and development needs of their respective elements.

The change of territory also affected the physical traits of the two races:
- The Wind race, which originally had horns, gained halos that came from their horns changing, so they looked even more like Angels.
- The Land race, which originally had halos, gained horns from broken halos, so they looked even more like Demons.

As time went on, the traits of Angels and Demons faded until the various races looked like humans.

Each race then divided into three groups based on element, belief, and their own development.

## Reincarnation System
The Reincarnation system was originally created by the rulers of Season 2. Their souls became the foundation of Reincarnation magic, but the system later changed.

The two Goddesses of Life cannot use GoE's power directly. They create souls and spirits, while GoE perfects them.

Because of this, the two Goddesses of Life changed the Reincarnation spell. The new spell replaced the old spell used by the Season 2 rulers.

The souls of the old rulers could no longer be detected easily. Although their active role disappeared, the power they had left behind remained and was revealed again in Season 9.

### The Reincarnator Covenant
The Reincarnators made a covenant with the two Goddesses of Life to perfect the souls of the Corporators. In return, the Corporators must fulfill the Reincarnator's greatest wish when the Apocalypse arrives.

The Reincarnator's soul moves into the body of someone whose soul is not yet perfect. That person becomes Corporator 1.

The Reincarnator can take over that body in critical situations or when they choose to.

If Corporator 1 dies before the task is completed, the Reincarnator's soul moves to Corporator 2, who becomes the second chance. If Corporator 2 dies before the task is completed, that soul moves to Corporator 3, the last chance.

The Reincarnator must perfect the soul of each Corporator. Every subsequent Corporator also enters the covenant to fulfill the Reincarnator's wish.

The Reincarnator and the existing Corporators can take over the body in critical situations or by their own choice.

If the task is not completed when the Apocalypse arrives, the souls involved cannot enter the afterlife. They will remain alive even after the Apocalypse, because their covenant has not been fulfilled.

### Family Relations and Name Notes
- **Shirogane** (Akari, Raika, Miharu): the three are cousins.
- **Kagetsu** (Homura and Akane): siblings.
- **Tachibana** (Mizuki and Mitsuki): biological siblings adopted by the Tachibana family. The surname Tachibana on Kazeha (Goddess of Wind) is only a coincidence because the surname is common. There is no family relationship between them.
- **In-Yō:** the names Inori (In, yin) and Yōna (Yō, yang) form In-Yō (yin-yang). Thing and Nothing are existence and nonexistence, two complementary sides.

### Concepts of the Gods and Goddesses
Many of the Gods and Goddesses come in pairs as dualisms:
- **Light and Dark:** the most basic dualism, light and darkness.
- **Thing and Nothing:** existence and nonexistence (In-Yō).
- **Lightning and Flash:** Reality and Imaginary (see below).
- **Space and Time:** differing views on the structure of reality (see below).
- **Life of Water and Life of Earth:** life in water and life on land.

#### Reality and Imaginary (Lightning and Flash)
The Goddess of Lightning is Reality and the Goddess of Flash is Imaginary. The concept is like real numbers and imaginary numbers.

There is something called state. A person can only touch or hit something that is in the same state as them. Reality can only touch Reality, and vice versa. The logic is based on the equation: 1 + 1 can be simplified, but 1 + 1i cannot be simplified any further. Because of this, different states cannot touch each other.
- **Reality:** manipulation of reality.
- **Imaginary:** manipulation of any imaginary world, including dream worlds and the imagination within the brain. Imagination can be changed into the Reality state so that it becomes real.

#### Space and Time
The God of Space and the God of Time hold different beliefs, and because of that the two often argue at length:
- **Space** believes in the concept of 4D, but also believes in the multiverse.
- **Time** believes that timelines are like roots: they grow from the same source and keep splitting. However, when two or more timelines are in exactly the same condition, they can merge, then split apart again.

Because their concepts differ, the relationship between Space and Time never truly clicks. They do not get along.

## Knights and Dragons
Since before Season 3, knights have raised dragons. After Light returned from Aether and Darkness returned from Nether, that relationship grew into a closer bond.

The dragons are the knights' wives. They have high intelligence, great physical and mental strength, and can generally take a humanoid form. They also serve as knights so they can go on adventures with their husbands.

In various conflicts, the knights suffered extremely severe injuries. The dragons finally sacrificed themselves, and their bodies and souls fused with the knights, turning them into half-dragon humans called Dragon Hybrids (Dragon Hibridas).

As a result of the fusion, the knights could no longer sense their wives' presence as before.

In Season 15, the two Goddesses of Life separated the dragons' souls from the knights. In this way, the knights could meet their wives again in humanoid form in the afterlife.

## Time Relations and Timelines
The Gods and Goddesses have only one existence in space. There are no alternate versions of them living in different universes merely because of differences in space.

However, their existence can appear across various timelines. They move along with the flow of time, as other beings do.

This is not a rule imposed on them, but the way they choose to exist. Managing many dimensions is already exhausting, let alone managing every timeline point by point. Therefore, they chose to flow with time, just like other living beings.

For this reason, the universe has branching timelines, but the main chronology of EXCEED/MEMENTO still moves forward from Season 1 to Season 15.

### The Substitute God of Time
After the God of Time shattered in Season 2, its position became empty. For the time being, the God of Time from Season 15 moved to that era and filled the position, because the six original fragments were scattered across different timelines.

This replacement was needed to prevent the chaos of an empty God of Time position and to stop other timelines from being colonized.

In Season 7 the six fragments were brought together, but did not get along because each had become an entity with its own opinions. In Season 8 they finally united into a complete God of Time and underwent metamorphosis. After the God of Time from the original timeline returned, the God of Time from Season 15 went back to focusing on managing their own timeline.

When the Gods and Goddesses realized something was wrong, they returned to the era of Season 1 and sealed GoE. This event links the early conflict with consequences only understood much later.

## Origin of the God of Everything
GoE came from two humans who loved each other and merged into a single entity.

In later developments, the two separated into two concepts:
- Goddess of Thing: Fujisaki Yōna
- God of Nothing: Kisaragi Inori

Thing represents existence, while Nothing represents nonexistence. Together they form Everything. Their names, Inori (In) and Yōna (Yō), form In-Yō (yin-yang).

GoE in Season 1 and GoE in Season 13 are two versions from different timeline branches. Both once changed the world in pursuit of absolute peace, but also had a desire to gain power.

In Season 15 Part 2, the two versions merged again into GoE 15.

Their conflict is tied not only to power, but also to questions about a creator's responsibility toward their creations, guilt, and whether past mistakes make a person no longer deserving to live.

## The First Figure — Supreme God
The First Figure is a neutral entity who serves as the main thread running through the story of the Gods and Goddesses. They are not an antagonist.

They are the one who moved humans to the world of emptiness and gave them the status of Gods and Goddesses, with the line "Kore ga omae-tachi no sadame da". That was part of their fate, not a malicious act meant to torment them. The First Figure was only carrying out that fate, even though they knew they would vanish existentially.

At the end of Season 13, the First Figure asked whether they wanted to stay Gods and Goddesses or return to being humans. After that, they let them return to the real world.

In Season 14, humans opened a portal to the magic world. Due to the change in world ownership, the real world, originally owned by the First Figure, passed to the Gods and Goddesses.

That transfer also affected other worlds because the real world is the base world.

The First Figure vanished at the exact moment that transfer occurred. Before vanishing, they asked that the good people of the original world be moved to the afterlife of the magic world. The Gods and Goddesses refused, then agreed to the replacement request: letting them live in peace in their own world.

## Main Themes of EXCEED/MEMENTO
EXCEED/MEMENTO centers on the relationship between creator and creation, the desire to fix the world, and the consequences that arise when someone tries to erase suffering by controlling everything.

The story also highlights how trauma can be inherited, how a system originally created to help can turn into a tool of oppression, and how the wish to fix the future can end up creating new disasters.

Through Mizuki and Mitsuki, the story shows how someone who has experienced violence may struggle to accept kindness, especially when they hold a secret and guilt over their past.

Through Fuyuki and Reina, the story explores how loss can change a person, how revenge does not always remove suffering, and how two people who face trauma together can still have different inner struggles.

The relationship between Fuyuki and Reina also highlights that love does not automatically heal past wounds. The feelings that grow between them must contend with regret, loss, and their status as Gods and Goddesses.

In the end, the journey of the Gods and Goddesses is not merely an effort to hold on to their power, but a process of understanding that they themselves came from imperfect humans.

They want to be revered as Gods and Goddesses, but also to be forgiven as humans.

    var ln=L[i],m;
    if(!ln.trim()){flushP();i++;continue}
    if((m=ln.match(/^(#{3,6})\s+(.+)$/))){
      flushP();
      var lvl=m[1].length,txt=m[2].trim(),id=slug(txt);
      toc.push({lvl:lvl,txt:txt,id:id});
      out.push('<h'+lvl+' id="'+id+'">'+inline(txt)+'<a class="anchor" href="#" data-a="'+id+'" aria-label="Link">#</a></h'+lvl+'>');
      i++;continue;
    }
    if(/^\s*---+\s*$/.test(ln)){flushP();out.push("<hr>");i++;continue}
    if(/^\|/.test(ln)){
      flushP();
      var rows=[];
      while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++}
      var cells=function(r){return r.replace(/^\|/,"").replace(/\|\s*$/,"").split("|").map(function(c){return c.trim()})};
      var head=cells(rows[0]),h="<div class=\"tablewrap\"><table><thead><tr>"+head.map(function(c){return "<th>"+inline(c)+"</th>"}).join("")+"</tr></thead><tbody>";
      for(var r=1;r<rows.length;r++){
        if(/^\|\s*:?-+/.test(rows[r]))continue;
        h+="<tr>"+cells(rows[r]).map(function(c){return "<td>"+inline(c)+"</td>"}).join("")+"</tr>";
      }
      out.push(h+"</tbody></table></div>");continue;
    }
    if(/^>/.test(ln)){
      flushP();
      var paras=[],b=[];
      while(i<L.length&&/^>/.test(L[i])){
        var t=L[i].replace(/^>\s?/,"");
        if(!t.trim()){if(b.length)paras.push(b);b=[]}else b.push(t);
        i++;
      }
      if(b.length)paras.push(b);
      out.push("<blockquote>"+paras.map(function(pb){
        return "<p>"+pb.map(function(t){
          var sm=t.match(/^([^:.!?*]{1,38}):\s+(.*)$/);
          if(sm)return '<span class="spk">'+esc(sm[1])+':</span> '+inline(sm[2]);
          return inline(t);
        }).join("<br>")+"</p>";
      }).join("")+"</blockquote>");
      continue;
    }
    if(/^\s*[-*]\s+/.test(ln)){
      flushP();
      var items=[];
      while(i<L.length&&/^\s*[-*]\s+/.test(L[i])){items.push(L[i].replace(/^\s*[-*]\s+/,""));i++}
      out.push("<ul>"+items.map(function(t){return "<li>"+inline(t)+"</li>"}).join("")+"</ul>");
      continue;
    }
    var sm2=ln.match(/^\*([^*]+)\*$/);
    if(sm2&&!pbuf.length){out.push("<p><em>"+inline(sm2[1])+"</em></p>");i++;continue}
    pbuf.push(ln);i++;
  }
  flushP();
  return out.join("\n");
}

/* ---------- stats from source ---------- */
var seasonPages=pages.filter(function(p){return p.group==="Season"});
var filmPage=pages.filter(function(p){return /^Films/.test(p.title)})[0];
var filmCount=filmPage?filmPage.lines.filter(function(l){return /^### \d+\./.test(l)}).length:0;

/* ---------- sidebar ---------- */
var nav=document.getElementById("nav");
function buildNav(activeSlug,toc){
  var h='<div class="grp">Home</div><a href="#/" class="'+(activeSlug==="home"?"on":"")+'">Home &amp; season list</a>';
  groupOrder.forEach(function(g){
    var ps=pages.filter(function(p){return p.group===g});
    if(!ps.length)return;
    h+='<div class="grp">'+esc(g)+'</div>';
    ps.forEach(function(p){
      var on=p.slug===activeSlug;
      h+='<a href="#/'+p.slug+'" class="'+(on?"on":"")+'">'+(p.num?'<span class="n">'+p.num+'</span>':"")+esc(p.label)+'</a>';
      if(on&&toc&&toc.length){
        var subs=toc.filter(function(t){return t.lvl===3});
        if(subs.length)h+='<div class="sub">'+subs.map(function(t){return '<a href="#" data-a="'+t.id+'">'+esc(plain(t.txt))+'</a>'}).join("")+'</div>';
      }
    });
  });
  nav.innerHTML=h;
}

/* ---------- views ---------- */
var article=document.getElementById("article"),tocEl=document.getElementById("toc");
var order=[{slug:"home",title:"Home"}].concat(pages.map(function(p){return {slug:p.slug,title:p.title}}));

function pager(slugNow){
  var idx=order.findIndex(function(o){return o.slug===slugNow});
  var prev=order[idx-1],next=order[idx+1];
  function a(o,cls,lab){return o?'<a class="'+cls+'" href="#/'+(o.slug==="home"?"":o.slug)+'"><small>'+lab+'</small><span>'+esc(o.title)+'</span></a>':'<a class="ph"></a>'}
  return '<div class="pager">'+a(prev,"prev","← Previous")+a(next,"next","Next →")+'</div>';
}

function renderHome(){
  document.title=docTitle+" Wiki";
  var h='<div class="eyebrow">Wiki · original work</div><h1>'+esc(docTitle)+'</h1>';
  h+='<div class="hero-wiki"><p class="lead">An fantasy story about humans who become gods, and who learn that divine power does not erase human flaws.</p>';
  h+='<div class="stats"><div class="stat"><b>'+seasonPages.length+'</b><span>Seasons</span></div><div class="stat"><b>'+filmCount+'</b><span>Films &amp; spin-offs</span></div><div class="stat"><b>'+pages.length+'</b><span>Pages</span></div></div></div>';
  h+='<div class="note" id="note"><span><b>Warning:</b> This wiki contains sensitive contents, including violence, loss, and trauma. This work exists only in its outline form, covering the overall storyline, character names, and other general details. The full story has not been written.</span><button type="button" aria-label="Close" id="noteX">×</button></div>';
  h+='<h2 style="margin-top:8px">Season list</h2><div class="sgrid">'+seasonPages.map(function(p){
    return '<a class="scard" href="#/'+p.slug+'"><div class="num">SEASON '+p.num+'</div><h4>'+esc(p.display)+'</h4><p>'+esc(p.sub||"")+'</p></a>';
  }).join("")+'</div>';
  var others=pages.filter(function(p){return p.group!=="Season"});
  h+='<h2>Explore</h2><div class="qgrid">'+others.map(function(p){
    return '<a href="#/'+p.slug+'"><small>'+esc(p.group)+'</small>'+esc(p.title)+'</a>';
  }).join("")+'</div>';
  h+=pager("home");
  article.innerHTML=h;
  tocEl.innerHTML="";
  buildNav("home");
  var nx=document.getElementById("noteX");
  if(nx)nx.onclick=function(){document.getElementById("note").remove()};
  bindCards();
}
function bindCards(){
  article.querySelectorAll(".scard").forEach(function(c){
    c.addEventListener("pointermove",function(e){var r=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-r.left)+"px");c.style.setProperty("--my",(e.clientY-r.top)+"px")});
  });
}

function renderPage(p,term){
  document.title=p.title+" · "+docTitle+" Wiki";
  var toc=[];
  var html='<div class="eyebrow">'+esc(p.eyebrow)+'</div><h1>'+esc(p.display)+'</h1>';
  if(p.sub)html+='<div class="sub">'+esc(p.sub)+'</div>';
  html+=renderMD(p.lines,toc);
  html+=pager(p.slug);
  article.innerHTML=html;
  buildNav(p.slug,toc);
  // right toc
  if(toc.length){
    tocEl.innerHTML='<div class="t">On this page</div>'+toc.filter(function(t){return t.lvl<=4}).map(function(t){return '<a class="h'+t.lvl+'" href="#" data-a="'+t.id+'">'+esc(plain(t.txt))+'</a>'}).join("");
  }else tocEl.innerHTML="";
  if(term)highlight(article,term);
}

function highlight(root,term){
  var re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),first=null;
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
  var nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(function(n){
    if(!re.test(n.nodeValue)){re.lastIndex=0;return}
    re.lastIndex=0;
    if(n.parentNode.closest("script,style,.anchor"))return;
    var frag=document.createDocumentFragment(),txt=n.nodeValue,last=0,m;
    while((m=re.exec(txt))){
      frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
      var mk=document.createElement("mark");mk.textContent=m[0];frag.appendChild(mk);
      if(!first)first=mk;last=m.index+m[0].length;
      if(m[0].length===0)re.lastIndex++;
    }
    frag.appendChild(document.createTextNode(txt.slice(last)));
    n.parentNode.replaceChild(frag,n);
  });
  if(first)setTimeout(function(){first.scrollIntoView({block:"center"})},40);
}

/* ---------- routing ---------- */
var pendingTerm=null;
function route(){
  var h=location.hash.replace(/^#\/?/,"");
  body.classList.remove("menu");
  if(!h||h==="home"){renderHome();window.scrollTo(0,0);return}
  var p=pages.filter(function(x){return x.slug===h})[0];
  if(!p){renderHome();return}
  renderPage(p,pendingTerm);
  if(!pendingTerm)window.scrollTo(0,0);
  pendingTerm=null;
}
window.addEventListener("hashchange",route);

/* in-page anchors (delegated) */
document.addEventListener("click",function(e){
  var a=e.target.closest("[data-a]");
  if(!a)return;
  e.preventDefault();
  var el=document.getElementById(a.getAttribute("data-a"));
  if(el){el.scrollIntoView({behavior:"smooth",block:"start"});body.classList.remove("menu")}
});

/* ---------- search ---------- */
var q=document.getElementById("q"),res=document.getElementById("results");
function doSearch(){
  var term=q.value.trim();
  if(term.length<2){res.hidden=true;res.innerHTML="";return}
  var re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"),hits=[];
  pages.forEach(function(p){
    var t=p.title+"\n"+p.text,m=re.exec(t);
    if(!m)return;
    var all=(t.match(new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"))||[]).length;
    var s=Math.max(0,m.index-50),e=Math.min(t.length,m.index+term.length+80);
    var snip=(s>0?"…":"")+t.slice(s,e).replace(/\s+/g," ")+(e<t.length?"…":"");
    hits.push({p:p,all:all,snip:snip});
  });
  hits.sort(function(a,b){return b.all-a.all});
  if(!hits.length){res.hidden=false;res.innerHTML='<div class="none">No results for “'+esc(term)+'”.</div>';return}
  var hre=new RegExp("("+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  res.hidden=false;
  res.innerHTML=hits.slice(0,25).map(function(h){
    return '<a href="#/'+h.p.slug+'" data-term="'+esc(term)+'"><div class="rt">'+esc(h.p.title)+' · '+h.all+'×</div><div class="rs">'+esc(h.snip).replace(hre,"<mark>$1</mark>")+'</div></a>';
  }).join("");
}
q.addEventListener("input",doSearch);
res.addEventListener("click",function(e){
  var a=e.target.closest("a[data-term]");
  if(!a)return;
  pendingTerm=a.getAttribute("data-term");
  if(location.hash==="#/"+a.getAttribute("href").slice(2)){e.preventDefault();route()}
});
document.addEventListener("keydown",function(e){
  if(e.key==="/"&&document.activeElement!==q&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();body.classList.add("menu");q.focus()}
  if(e.key==="Escape"){q.value="";doSearch();q.blur();body.classList.remove("menu")}
});

/* ---------- chrome ---------- */
var themeBtn=document.getElementById("themeBtn");
try{if(localStorage.getItem("wiki-theme")==="light")body.classList.add("light")}catch(e){}
function themeUI(){var l=body.classList.contains("light");themeBtn.textContent=l?"☾":"☼";document.querySelector('meta[name="theme-color"]').setAttribute("content",l?"#f7f6f1":"#0b0b0d")}
themeUI();
themeBtn.onclick=function(){body.classList.toggle("light");try{localStorage.setItem("wiki-theme",body.classList.contains("light")?"light":"dark")}catch(e){}themeUI()};
document.getElementById("menuBtn").onclick=function(){body.classList.toggle("menu")};
document.getElementById("scrim").onclick=function(){body.classList.remove("menu")};

var prog=document.getElementById("progress");
function onScroll(){
  var h=document.documentElement,max=h.scrollHeight-h.clientHeight;
  prog.style.width=(max>0?(h.scrollTop/max)*100:0)+"%";
  // scroll-spy
  var links=tocEl.querySelectorAll("a[data-a]");
  if(!links.length)return;
  var curId=null;
  links.forEach(function(a){
    var el=document.getElementById(a.getAttribute("data-a"));
    if(el&&el.getBoundingClientRect().top<140)curId=a.getAttribute("data-a");
  });
  links.forEach(function(a){a.classList.toggle("on",a.getAttribute("data-a")===curId)});
}
window.addEventListener("scroll",onScroll,{passive:true});

route();
window.__wiki={pages:pages,seasonCount:seasonPages.length,filmCount:filmCount};
})();
</script>
